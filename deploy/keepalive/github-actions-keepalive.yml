# READY TO ENABLE — copy to .github/workflows/keepalive.yml
#
# It is not active yet because the GitHub token used for deployment lacked the
# `workflow` scope, which GitHub requires before a token may create workflow
# files. Once a token with that scope is supplied (or the file is committed from
# the web UI), copy it into place and the 5-minute cron starts immediately.
#
# Keep the free API instance from spinning down.
#
# Render suspends a free web service after 15 minutes without traffic, and the
# next request then waits 30–60 seconds to wake it. For a comparison site whose
# whole promise is speed, that first impression is unacceptable.
#
# GitHub Actions scheduled runs are free on public repositories, so this costs
# nothing and needs no extra account. Two honest caveats:
#   • GitHub's scheduler can be delayed by several minutes under load; this is a
#     mitigation, not a guarantee.
#   • Scheduled workflows are disabled automatically after 60 days of repository
#     inactivity. Any push re-enables them.
name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the API
        run: |
          url="https://dealmosaic-api.onrender.com/api/health"
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 90 --retry 2 --retry-delay 10 "$url")
          echo "HTTP $code"
          cat /tmp/health.json || true
          # A cold start can outlast one attempt; only fail on a genuinely bad status.
          if [ "$code" != "200" ]; then
            echo "::warning::API health returned $code"
          fi
