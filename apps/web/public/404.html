<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found — DEALMOSAIC</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/Outfit.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face{font-family:Outfit;src:url('/fonts/Outfit.woff2') format('woff2');font-weight:400 800;font-display:swap}
      @font-face{font-family:'Plus Jakarta Sans';src:url('/fonts/Plus-Jakarta-Sans.woff2') format('woff2');font-weight:400 800;font-display:swap}
      :root{--ink:#452b5e;--ink-muted:#6b5280;--surface:#fff9f0;--tint:#fdf1e7;--hairline:#ebddea;--violet:#8b5cf6;--coral:#ff6b6b;--sun:#ffbe0b;--turq:#2ec4b6;--blue:#4361ee}
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--surface);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6}
      .card{max-width:560px;width:100%;background:#fff;border:1px solid var(--hairline);border-radius:24px;padding:40px 28px;text-align:center;box-shadow:0 18px 40px -28px rgba(69,43,94,.35)}
      .tiles{display:flex;gap:10px;justify-content:center;margin-bottom:24px}
      .tiles i{width:26px;height:26px;border-radius:8px;display:block}
      h1{font-family:Outfit,system-ui,sans-serif;font-size:clamp(28px,7vw,40px);line-height:1.15;margin:0 0 12px;letter-spacing:-.02em}
      p{color:var(--ink-muted);margin:0 0 28px;font-size:17px}
      .links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
      a{display:inline-block;padding:13px 22px;border-radius:14px;text-decoration:none;font-weight:700;font-size:15px;min-height:48px;line-height:22px}
      a.primary{background:var(--ink);color:#fff}
      a.ghost{background:var(--tint);color:var(--ink);border:1px solid var(--hairline)}
      a:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
      @media(prefers-reduced-motion:no-preference){.card{animation:rise .4s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="tiles" aria-hidden="true">
        <i style="background:var(--coral)"></i><i style="background:var(--sun)"></i><i style="background:var(--turq)"></i><i style="background:var(--blue)"></i>
      </div>
      <h1>That page isn’t here</h1>
      <p>The link may be old, or the product may have moved. Nothing is broken on your side.</p>
      <div class="links">
        <a class="primary" href="/">Go to search</a>
        <a class="ghost" href="/browse">Browse categories</a>
      </div>
    </main>
  </body>
</html>
